name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua-version:
          - "5.1"
          - "5.2"
          - "5.3"
          - "5.4"
          - "luajit"
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: ${{ matrix.lua-version }}
      - uses: leafo/gh-actions-luarocks@v5
      - run: luarocks install busted
      - run: luarocks install penlight
      - run: luarocks lint argrule-scm-1.rockspec
      - run: busted -m './lua/?.lua;./lua/?/init.lua;./spec/?.lua'
      - run: luac -p lua/argrule/*.lua spec/*.lua
      - run: '! grep -RniE "paddle|insight|torch" lua spec README.md docs argrule-scm-1.rockspec'

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check .
