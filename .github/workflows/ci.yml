name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua-version:
          - "5.1"
          - "5.2"
          - "5.3"
          - "5.4"
          - "luajit"
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: ${{ matrix.lua-version }}
      - uses: leafo/gh-actions-luarocks@v5
      - name: Install test dependencies
        run: |
          if [ "${{ matrix.lua-version }}" = "luajit" ]; then
            luarocks install --deps-mode=none https://luarocks.org/lua_cliargs-3.0.2-1.src.rock
            luarocks install --deps-mode=none https://luarocks.org/luasystem-0.7.1-1.src.rock
            luarocks install --deps-mode=none https://luarocks.org/dkjson-2.11-1.src.rock
            luarocks install --deps-mode=none https://luarocks.org/say-1.4.1-3.src.rock
            luarocks install --deps-mode=none https://luarocks.org/luassert-1.9.0-1.src.rock
            luarocks install --deps-mode=none https://luarocks.org/lua-term-0.8-1.rockspec
            luarocks install --deps-mode=none https://luarocks.org/luafilesystem-1.9.0-1.src.rock
            luarocks install --deps-mode=none https://luarocks.org/penlight-1.15.0-1.src.rock
            luarocks install --deps-mode=none https://luarocks.org/mediator_lua-1.1.2-0.rockspec
            luarocks install --deps-mode=none https://luarocks.org/busted-2.3.0-1.src.rock
          else
            luarocks install busted
          fi
      - run: luarocks lint argrule-scm-1.rockspec
      - run: busted -m './lua/?.lua;./lua/?/init.lua;./spec/?.lua'
      - run: luac -p lua/argrule/*.lua spec/*.lua
      - run: '! grep -RniE "paddle|insight|torch" lua spec README*.md docs argrule-scm-1.rockspec'

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check .
